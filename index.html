
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CPC Direct | Autonomous Growth Platform for SMEs</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --midnight: #0A192F;
            --charcoal: #112240;
            --gold: #C5A059;
            --slate: #8892B0;
        }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--midnight);
            color: #f8fafc;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }
        .glass-panel {
            background: rgba(17, 34, 64, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(197, 160, 89, 0.1);
        }
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: var(--midnight);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--gold);
            border-radius: 2px;
        }
        .mobile-optimized {
            content-visibility: auto;
        }
        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .animate-slide-up {
            animation: slideUp 0.5s ease-out forwards;
        }

        /* Active Navigator Highlights */
        @keyframes pulse-gold {
            0% { box-shadow: 0 0 0 0 rgba(197, 160, 89, 0.7); border-color: #C5A059; }
            70% { box-shadow: 0 0 0 20px rgba(197, 160, 89, 0); border-color: #C5A059; }
            100% { box-shadow: 0 0 0 0 rgba(197, 160, 89, 0); border-color: rgba(197, 160, 89, 0.3); }
        }
        .nav-highlight {
            position: relative;
            z-index: 201 !important;
            animation: pulse-gold 2s infinite;
            border: 2px solid #C5A059 !important;
            pointer-events: auto !important;
        }
        .dim-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 200;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }
        .dim-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
    </style>
